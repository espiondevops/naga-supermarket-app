name: Build and Test Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download code from repository onto the cloud runner
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx engine
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build the Docker Image automatically
      - name: Build Docker Image
        run: |
          docker build -t naga-supermarket:test .

      # Step 4: Run the container and verify it starts cleanly
      - name: Test Container Execution
        run: |
          docker run -d -p 5000:5000 --name test-app naga-supermarket:test
          sleep 3
          curl --fail http://localhost:5000/ || exit 1
